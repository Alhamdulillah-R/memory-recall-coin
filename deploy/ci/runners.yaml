---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-recall-coin-runner-deploy-state
  namespace: mignon-ci
  labels:
    app.kubernetes.io/name: memory-recall-coin-runner-deploy
    app.kubernetes.io/part-of: mignon-ci
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
