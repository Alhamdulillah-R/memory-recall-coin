---
apiVersion: v1
kind: Namespace
metadata:
  name: mignon-ci
  labels:
    app.kubernetes.io/part-of: mignon-ci
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-recall-coin-runner-test-state
  namespace: mignon-ci
  labels:
    app.kubernetes.io/name: memory-recall-coin-runner-test
    app.kubernetes.io/part-of: mignon-ci
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-recall-coin-runner-build-state
  namespace: mignon-ci
  labels:
    app.kubernetes.io/name: memory-recall-coin-runner-build
    app.kubernetes.io/part-of: mignon-ci
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
