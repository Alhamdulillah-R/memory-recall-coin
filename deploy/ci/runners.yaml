              value: memory-recall-coin-deploy
            - name: RUNNER_LABELS
              value: tokyo,tokyo-deploy,k8s-deployer
            - name: RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: memory-recall-coin-runner-deploy-registration
                  key: token
                  optional: true
            - name: ACTIONS_RUNNER_HOOK_JOB_COMPLETED
              value: /usr/local/libexec/mignon-ci/job-cleanup.sh
            - name: ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT
              value: "1"
            - name: HOME
              value: /runner-state/home
            - name: RUNNER_TOOL_CACHE
              value: /runner-state/app/_work/_tool
            - name: TMPDIR
              value: /tmp
            - name: KUBECONFIG
              value: >-
                /etc/mignon-ci/kubeconfigs/Alhamdulillah-R__memory-recall-coin.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 123
          volumeMounts:
            - name: runner-state
              mountPath: /runner-state
            - name: runtime-temp
              mountPath: /tmp
            - name: credential-runtime
              mountPath: /etc/mignon-ci
              readOnly: true
      volumes:
        - name: runner-state
          persistentVolumeClaim:
            claimName: memory-recall-coin-runner-deploy-state
        - name: runtime-temp
          emptyDir:
            sizeLimit: 256Mi
        - name: credential-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: kubeconfig-source
          secret:
            secretName: memory-recall-coin-deploy-kubeconfig
            defaultMode: 0440
            items:
              - key: config
                path: config
