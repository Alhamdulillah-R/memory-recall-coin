apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: memory-recall-db
  namespace: memory-recall-coin
  labels:
    app.kubernetes.io/name: memory-recall-db
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: memory-recall-coin
spec:
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  selector:
    matchLabels:
      cnpg.io/cluster: memory-recall-db
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: memory-recall-embedding
  namespace: memory-recall-coin
  labels:
    app.kubernetes.io/name: memory-recall-embedding
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: memory-recall-coin
spec:
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-recall-embedding
      app.kubernetes.io/component: embedding
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: memory-recall-coin
  namespace: memory-recall-coin
  labels:
    app.kubernetes.io/name: memory-recall-coin
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: memory-recall-coin
spec:
  groups:
    - name: memory-recall-coin.availability
      interval: 30s
      rules:
        - alert: MemoryRecallPostgresInstanceMetricsUnavailable
          expr: |
            count(
              cnpg_collector_up{
                namespace="memory-recall-coin",
                job="memory-recall-coin/memory-recall-db"
              } == 1
            ) < 3
            or absent(
              cnpg_collector_up{
                namespace="memory-recall-coin",
                job="memory-recall-coin/memory-recall-db"
              }
            )
          for: 5m
          labels:
            severity: critical
            notify: email
          annotations:
            summary: memory-recall-db has fewer than three healthy metrics targets
        - alert: MemoryRecallPostgresReplicationDegraded
          expr: |
            max(
              cnpg_pg_replication_streaming_replicas{
                namespace="memory-recall-coin",
                job="memory-recall-coin/memory-recall-db"
              }
            ) < 2
            or absent(
              cnpg_pg_replication_streaming_replicas{
                namespace="memory-recall-coin",
                job="memory-recall-coin/memory-recall-db"
              }
            )
          for: 2m
          labels:
            severity: critical
            notify: email
          annotations:
            summary: memory-recall-db has fewer than two streaming replicas
        - alert: MemoryRecallApplicationUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="memory-recall-coin",
              deployment="memory-recall-coin"
            } < 1
            or absent(
              kube_deployment_status_replicas_available{
                namespace="memory-recall-coin",
                deployment="memory-recall-coin"
              }
            )
          for: 2m
          labels:
            severity: critical
            notify: email
          annotations:
            summary: memory-recall-coin has no available replica
        - alert: MemoryRecallEmbeddingUnavailable
          expr: |
            kube_deployment_status_replicas_available{
              namespace="memory-recall-coin",
              deployment="memory-recall-embedding"
            } < 1
            or absent(
              kube_deployment_status_replicas_available{
                namespace="memory-recall-coin",
                deployment="memory-recall-embedding"
              }
            )
          for: 5m
          labels:
            severity: critical
            notify: email
          annotations:
            summary: memory-recall embedding service has no available replica
